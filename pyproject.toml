[project]
name = "belliGPT"
version = "0.1.0"
description = "Language Modeling experiments on 19th-Century Romanesco sonnets."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.1.8",
    "requests>=2.32.5",
    "torch>=2.9.1",
    "wandb>=0.24.0",
    "transformers>=4.57.6",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "widgetsnbextension>=4.0.15",
    "datasets>=4.3.0,<4.4.0",
    "hydra-core>=1.3.2",
    "pytest>=9.0.2",
    "sentencepiece>=0.2.1",
    "unsloth>=2026.3.7",
    "huggingface-hub==0.34.0",
    "matplotlib>=3.10.9",
    "types-pyyaml>=6.0.12.20260518",
    "llama-cpp-python>=0.3.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "char*", "subw*", "syllable*", "finetune*"]
